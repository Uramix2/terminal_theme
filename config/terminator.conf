[global_config]
  tab_position = top
  scroll_tabbar = True
  close_button_on_tab = False
  enabled_plugins = LaunchpadBugURLHandler, LaunchpadCodeURLHandler, APTURLHandler, OrbiteNumberedTabs, OrbiteTabKeys, OrbiteWindowFrame, OrbiteCloseRightTab, OrbiteWallpaper
  borderless = True
  window_state = maximise
[keybindings]
  go_up = None
  go_down = None
  go_left = None
  go_right = None
  split_horiz = None
  split_vert = None
  switch_to_tab_1 = <Alt>1
  switch_to_tab_2 = <Alt>2
  switch_to_tab_3 = <Alt>3
  switch_to_tab_4 = <Alt>4
  switch_to_tab_5 = <Alt>5
  switch_to_tab_6 = <Alt>6
  switch_to_tab_7 = <Alt>7
  switch_to_tab_8 = <Alt>8
  switch_to_tab_9 = <Alt>9
[profiles]
  [[default]]
    background_color = "#111521"
    background_darkness = 0.86
    background_type = image
    background_image = @TERMINAL_IMAGE@
    background_image_mode = scale_and_crop
    cursor_blink = False
    font = MesloLGS NF 12
    foreground_color = "#e8edf5"
    show_titlebar = False
    scrollbar_position = hidden
    scrollback_lines = 10000
    palette = "#202638:#f08f9b:#add5bc:#e6c79c:#a6c4ee:#d1b1e5:#a9cfdc:#e8edf5:#8591a8:#ffafba:#c6e4ce:#f3dabc:#c4d8f5:#e8c6e8:#c8e5ed:#f8f5fa"
    use_custom_command = True
    custom_command = @TMUX_COMMAND@
    use_system_font = False
    title_hide_sizetext = True
    title_transmit_fg_color = "#edb4cd"
    title_transmit_bg_color = "#293047"
    title_inactive_fg_color = "#929bb3"
    title_inactive_bg_color = "#111521"
    cursor_color = "#edb4cd"
    exit_action = close
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = Terminal
      parent = window0
[plugins]
