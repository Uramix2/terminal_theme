# Orbite: tmux handles sessions and panes; Terminator supplies font/background.
set -g default-shell /usr/bin/zsh
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB'
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-clipboard on
set -g copy-command '~/.local/bin/orbite-copy'
set -g update-environment 'DISPLAY WAYLAND_DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK SSH_AGENT_PID'
setw -g automatic-rename on
setw -g allow-rename off
set -g detach-on-destroy on

# Leave normal pane backgrounds transparent to the terminal's wallpaper.
setw -g window-style 'fg=default,bg=default'
setw -g window-active-style 'fg=default,bg=default'
set -g pane-border-style 'fg=#343b4d,bg=default,nobold'
set -g pane-active-border-style 'fg=#817b98,bg=default,nobold'
set -g pane-border-status top
set -g pane-border-format '#[fg=#edb4cd,bold] #{pane_index} #[fg=#a8cdea] #{pane_current_path} #[fg=#929bb3,nobold]· #{pane_current_command} '
set -g pane-border-lines single
set -g pane-border-indicators off
set -g mode-style 'fg=#f8f5fa,bg=#35405a'
set -g message-style 'fg=#e8edf5,bg=#293047'
set -g message-command-style 'fg=#a8cdea,bg=#293047'
set -g display-time 3000
set -g status-style 'fg=#c7c8d8,bg=#111521'
set -g status-position bottom
set -g status-interval 10
set -g status-left-length 35
set -g status-left '#[fg=#edb4cd,bold] ORBITE #[fg=#a8cdea,nobold]#S  '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#f8f5fa,bg=#293047,bold] #I:#W #[default]'
set -g status-right-length 55
set -g status-right '#[fg=#929bb3]Ctrl-b ? aide  #[fg=#edb4cd]#{?client_prefix,PREFIXE ,}#[fg=#a8cdea]%H:%M '

# Keep Ctrl-b and the normal defaults. Alt+Right still completes a Zsh word.
bind | split-window -h -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind g select-layout tiled
bind r source-file ~/.tmux.conf \; display-message 'Configuration Orbite rechargee'
bind ? display-popup -E -w 85% -h 85% 'less -R ~/.config/orbite/AIDE-TMUX.txt'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.local/bin/orbite-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '~/.local/bin/orbite-copy'
