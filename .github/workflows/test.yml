name: Test installation
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm, debian:trixie]
    steps:
      - uses: actions/checkout@v4
      - name: Test real Zsh, tmux and GTK in isolated Linux containers
        run: docker run --rm -v "$PWD:/workspace:ro" "${{ matrix.image }}" sh /workspace/tests/container-test.sh
